; Требования приложения к PHP 8.3 (php-fpm) — mlp-evening.ru (MLP-327).
; В FASTPANEL значения задаются в настройках сайта (панель пишет их в пул php-fpm как php_admin_value);
; на чистом сервере — drop-in /etc/php/8.3/fpm/conf.d/99-mlp-evening.ini.
; Расширения: mysqli, mbstring, curl, gd (JPEG + WebP), openssl, opcache.
date.timezone = UTC          ; БД и код работают в UTC; таймкоды для людей код сам переводит в МСК
memory_limit = 256M
upload_max_filesize = 32M    ; приложение ограничивает загрузку 30 МБ; nginx client_max_body_size 32m
post_max_size = 32M
max_execution_time = 300
max_input_vars = 10000
display_errors = Off
log_errors = On
short_open_tag = On
opcache.enable = 1
