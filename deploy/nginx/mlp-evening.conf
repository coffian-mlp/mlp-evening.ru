# mlp-evening.ru — правила приложения для nginx + php-fpm (MLP-327).
# Целевой путь на сервере с FASTPANEL: /etc/nginx/fastpanel2-includes/mlp-evening.conf
# (панель подключает /etc/nginx/fastpanel2-includes/*.conf внутрь server{} сайта).
# Заменяет .htaccess: на nginx + php-fpm .htaccess не действует. После правки: nginx -t && systemctl reload nginx.
# Сокет php-fpm (fastcgi_pass) — из пула сайта: /var/run/<site>.sock.
client_max_body_size 32m;

# Centrifugo (websocket чата)
location ^~ /connection/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# SSE-фоллбек чата (используется только при CHAT_DRIVER != centrifugo)
location = /chat_stream.php {
    include /etc/nginx/fastcgi_params;
    fastcgi_pass unix:/var/run/mlp-evening.ru.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_buffering off;
    fastcgi_read_timeout 3600s;
}

# Непубличные каталоги
location ^~ /tests/         { deny all; }
location ^~ /migrations/    { deny all; }
location ^~ /scripts/       { deny all; }
location ^~ /docs/          { deny all; }
location ^~ /dev_knowledge/ { deny all; }
location ^~ /logs/          { deny all; }
location ^~ /cache/         { deny all; }
location ^~ /tools/         { deny all; }
location ^~ /deploy/        { deny all; }
location ^~ /node_modules/  { deny all; }

# dot-файлы и dot-каталоги: .env, .git, .docker, .claude, .htaccess, .user.ini
location ~ /\. { deny all; }

# /src: статика компонентов (css/js) публична, исходники — нет
location ^~ /src/ {
    location ~ /\. { deny all; }
    location ~* \.(php|inc|sql|md|json|lock)$ { deny all; }
}

# служебные точки входа (только CLI)
location = /migrate.php    { deny all; }
location = /bot_worker.php { deny all; }
location = /cron_llm.php   { deny all; }
location = /init.php       { deny all; }
location = /autoload.php   { deny all; }

# конфиги, дампы, логи, документация, скрипты
location ~* \.(sql|log|md|sample|yml|yaml|lock|ini|env|sh|ps1|py|plist)$ { deny all; }
location ~* ^/(package\.json|package-lock\.json|docker-compose\.yml|centrifugo_config(\.sample)?\.json|playwright\.config\.js|composer\.json)$ { deny all; }

# загрузки пользователей: без исполнения, кэш картинок
location ^~ /upload/ {
    location ~ /\. { deny all; }
    location ~* \.(php|phtml|phar|pl|py|sh|cgi)$ { deny all; }
    location ~* \.(png|jpe?g|gif|webp)$ { expires 30d; add_header Cache-Control "public"; }
}
