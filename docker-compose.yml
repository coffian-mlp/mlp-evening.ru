services:
  # Наш веб-сервер (Nginx)
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - db
      - centrifugo
    networks:
      - mlp-net

  # Интерпретатор PHP
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - mlp-net

  # База данных MySQL
  db:
    # MySQL 8.0 — как на проде (коллация utf8mb4_0900_ai_ci; дамп прода импортируется без правок). MLP-327.
    # sql_mode: на проде пустой; в dev оставлен STRICT_TRANS_TABLES (ловит переполнения колонок в тестах),
    # но без ONLY_FULL_GROUP_BY — иначе падали бы GROUP BY-запросы, которые на проде работают.
    image: mysql:8.0
    command: >
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      --default-time-zone=+00:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      # Креды — из .env в корне проекта (compose читает его нативно); AR5-1/MLP-252.
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
      # Магия! Этот файл автоматически выполнится при первом запуске контейнера,
      # создав структуру таблиц и наполнив их данными.
      - ./database.sample.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mlp-net

  # Centrifugo (Real-time Server)
  centrifugo:
    image: centrifugo/centrifugo:v5
    volumes:
      - ./centrifugo_config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - mlp-net

networks:
  mlp-net:
    driver: bridge

volumes:
  db_data:
